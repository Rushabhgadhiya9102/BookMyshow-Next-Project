name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  validate:
    name: Lint, Typecheck, Test & Build (Section 132)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=./packages/database/prisma/schema.prisma

      - name: Run strict TypeScript typecheck
        run: npm run check-types

      - name: Run ESLint
        run: npm run lint

      - name: Run automated invariant unit tests
        run: npm test

      - name: Build production artifacts
        run: npm run build
