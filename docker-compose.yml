services:
  postgres:
    image: postgres:16-alpine
    container_name: bms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: bookmyshow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookmyshow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: bms-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      NODE_ENV: "production"
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/bookmyshow?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "change_me_in_production_jwt_secret_key_minimum_32_chars"
      JWT_REFRESH_SECRET: "change_me_in_production_jwt_refresh_secret_key_minimum_32_chars"
      NEXT_PUBLIC_CLIENT_URL: "http://localhost:3000"
      NEXT_PUBLIC_ADMIN_URL: "http://localhost:3001"
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: bms-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: "production"
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: bms-admin
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      NODE_ENV: "production"
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"

volumes:
  postgres_data:
  redis_data:
